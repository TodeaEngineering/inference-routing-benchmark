<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="'Plus Jakarta Sans', Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Inference routing benchmark architecture</title>
<desc id="desc">Make, run on your machine, drives the cluster with terraform, helm and kubectl, and results come back to results/. On one GKE Spot g4-standard-48 node, a load-generator Job sends requests on a new connection each to the router under test, one stack at a time: the Kubernetes Service, Dynamo, Kinference, Kthena, llm-d or production-stack. The router sends them to three vLLM replicas of 28,000 MiB each and reads their KV events and metrics. The replicas share one NVIDIA RTX PRO 6000 of 96 GB through HAMi, which caps memory but not compute. Dynamo runs replace the replicas with three Dynamo workers.</desc>
