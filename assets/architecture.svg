<text x="180" y="256" font-size="12" font-weight="400" fill="#525252" text-anchor="middle">new connection per request</text>
<rect x="340" y="204" width="476" height="176" rx="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.0"/>
