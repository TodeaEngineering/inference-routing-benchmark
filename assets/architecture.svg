<text x="364" y="259" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">Kubernetes Service: kube-proxy rules</text>
<text x="364" y="280" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">Dynamo: Frontend with its KV router</text>
<text x="364" y="301" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">Kinference: Buoyant Gateway and Kinference</text>
<text x="364" y="322" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">Kthena: the Kthena router</text>
<text x="364" y="343" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">llm-d: Envoy and the endpoint picker</text>
<text x="364" y="364" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">production-stack: its Python router</text>
