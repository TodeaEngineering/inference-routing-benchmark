# Kinference in front of the replicas: one worker set, one pool, one route.
apiVersion: kinference.buoyant.io/v1alpha1
kind: InferenceWorkerSet
metadata:
  name: vllm
  namespace: __NS__
  labels:
    app.kubernetes.io/part-of: routing-bench
spec:
  profile: default
  # Tokens per published KV-cache block. 16 for standard vLLM.
  kvBlockSize: 16
  serviceRef:
    name: vllm
    port: http
  kvEvents:
    port: kv-pub
---
apiVersion: kinference.buoyant.io/v1alpha1
kind: InferencePool
metadata:
  name: vllm-pool
  namespace: __NS__
  labels:
    app.kubernetes.io/part-of: routing-bench
spec:
  destinations:
    - kind: InferenceWorkerSet
      name: vllm
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kinference-gw
  namespace: __NS__
  labels:
    app.kubernetes.io/part-of: routing-bench
  annotations:
    # The gateway's Service defaults to LoadBalancer, which on GKE is a public
    # address in front of an unauthenticated model. Keep it inside the cluster.
    gateway.buoyant.io/service-type: ClusterIP
spec:
  gatewayClassName: buoyant-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kinference-route
  namespace: __NS__
  labels:
    app.kubernetes.io/part-of: routing-bench
spec:
  parentRefs:
    - name: kinference-gw
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - group: kinference.buoyant.io
          kind: InferencePool
          name: vllm-pool
